[package]
name = "pterminal"
version = "0.1.25"
edition = "2024"
# `src/bin/pterm_hook.rs` adds a second binary target; pin `cargo run` to the
# GUI app so it stays unambiguous without an explicit `--bin`.
default-run = "pterminal"

# The root package IS the `pterminal` binary (plus `pterm_hook`), not a
# virtual manifest, so `target/release/pterminal.exe` / `pterm_hook.exe` keep
# the paths `installer/pterminal.iss` ships and `build.rs`'s icon embedding
# stays per-package here. The `version` line above must stay the FIRST
# `version = "..."` in this file: `.github/workflows/release.yml` greps it to
# check the release tag, and the in-app update check compares against it.
#
# Layout (A6): `crates/pterminal-core` is the egui-free logic,
# `crates/pterminal-term` the embedded terminal (vendored egui_term +
# `TabTerm`), and this package the egui/eframe app on top of both.
[workspace]
members = ["crates/pterminal-core", "crates/pterminal-term"]

# Every third-party version is pinned exactly once, here; the member crates
# say `.workspace = true`. egui is pinned to 0.31.x because
# `crates/pterminal-term` is a patched copy of egui_term 0.1.0 written
# against egui 0.31, and eframe below is pinned to match — `cargo tree -i
# egui` must keep showing exactly one egui version.
[workspace.dependencies]
alacritty_terminal = "0.25.1"
anyhow = "1.0.104"
arboard = "3.6.1"
dirs = "6.0.0"
egui = "0.31.1"
notify = "8.2.0"
open = "5.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.38.4"
tempfile = "3.27.0"
pterminal-core = { path = "crates/pterminal-core" }
pterminal-term = { path = "crates/pterminal-term" }

[dependencies]
pterminal-core.workspace = true
pterminal-term.workspace = true
anyhow.workspace = true
eframe = "0.31.1"
egui.workspace = true
notify.workspace = true
rfd = "0.17.2"
serde_json.workspace = true

[dev-dependencies]
# Thai-fallback font metric checks (ui.rs): already in the tree via epaint,
# so this adds no new download — pin the same minor.
ab_glyph = "0.2"
tempfile.workspace = true

[build-dependencies]
# build.rs: embeds assets/icon.ico into the exe as a Windows resource.
winresource = "0.1"
