[package]
name = "pterminal"
version = "0.1.12"
edition = "2024"
# `src/bin/pterm_hook.rs` adds a second binary target; pin `cargo run` to the
# GUI app so it stays unambiguous without an explicit `--bin`.
default-run = "pterminal"

[dependencies]
# src/egui_term_vendored is a patched copy of egui_term 0.1.0; these three are its
# dependencies. It is written against egui 0.31, which is why eframe is pinned to
# 0.31.x — `cargo tree -i egui` must keep showing exactly one egui version.
alacritty_terminal = "0.25.1"
anyhow = "1.0.104"
# Right-click terminal menu's "Paste" reads the OS clipboard directly
# (keyboard Ctrl+V does not — it uses egui's built-in `Event::Paste`).
arboard = "3.6.1"
dirs = "6.0.0"
eframe = "0.31.1"
egui = "0.31.1"
notify = "8.2.0"
open = "5.3.2"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.38.4"

[dev-dependencies]
# Thai-fallback font metric checks (ui.rs): already in the tree via epaint,
# so this adds no new download — pin the same minor.
ab_glyph = "0.2"
tempfile = "3.27.0"

[build-dependencies]
# build.rs: embeds assets/icon.ico into the exe as a Windows resource.
winresource = "0.1"
