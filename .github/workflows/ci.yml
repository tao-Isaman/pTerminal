# Builds and tests on Linux and Windows for every push to a branch and every
# pull request. Publishing stays in release.yml (tags only).
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q pkg-config libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libfontconfig-dev libfreetype-dev libdbus-1-dev libudev-dev

      - uses: Swatinem/rust-cache@v2

      - name: build
        run: cargo build --workspace --all-targets

      - name: test
        run: cargo test --workspace --no-fail-fast
