# Builds the Linux tarball for an EXISTING release tag and attaches it.
# For when release.yml's linux job failed after the Windows release was
# published: re-running that job would reuse the tag's own (broken) workflow,
# and tags are never moved. Run from the Actions tab with the tag name.
name: release-linux

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "existing release tag, e.g. v0.2.0-rc1"
        required: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q pkg-config libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libfontconfig-dev libfreetype-dev libdbus-1-dev libudev-dev \
            fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji
      - name: test
        run: cargo test --workspace
      - name: build
        run: cargo build --release
      - name: package and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          name="pTerminal-${TAG}-linux-x86_64"
          mkdir -p "$name"
          cp target/release/pterminal target/release/pterm_hook README.md THIRD-PARTY-NOTICES.txt "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          gh release upload "$TAG" "$name.tar.gz" "$name.tar.gz.sha256" --clobber
