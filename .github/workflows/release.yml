# Builds and publishes a GitHub Release with the Windows installer whenever a
# v* tag is pushed. Release procedure (from the design doc): bump `version` in
# the ROOT Cargo.toml (the `pterminal` package — the two library crates under
# `crates/` carry a `0.0.0` placeholder), commit, `git tag vX.Y.Z`,
# `git push --tags` — the in-app update check compares the release tag
# against the root package's CARGO_PKG_VERSION, so they must match (the
# "versions agree" step enforces it).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release + upload the installer

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: versions agree (tag vs Cargo.toml)
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME.TrimStart('v')
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          if ($tag -ne $cargo) {
            throw "tag v$tag does not match Cargo.toml version $cargo - the update check would never see this release as its own version"
          }

      # Windows Terminal's ConPTY (conpty.dll + OpenConsole.exe, MIT) ships
      # next to pterminal.exe: it measures text by grapheme cluster (the flag
      # the vendored alacritty_terminal passes) and carries ConPTY fixes the
      # inbox one on users' Windows builds may lack. Pinned to one version,
      # checked against the SHA-512 NuGet publishes for it, and each binary
      # must carry a valid Microsoft Authenticode signature
      # (.github/scripts/fetch-conpty.ps1).
      - name: fetch ConPTY
        shell: pwsh
        run: .github\scripts\fetch-conpty.ps1

      # `--workspace`: the root package is the binary, and a bare `cargo test`
      # there tests only that package — the `pterminal-core` and
      # `pterminal-term` library tests would silently stop running.
      # This run uses the inbox ConPTY (the fallback path).
      - name: test
        run: cargo test --workspace

      # Again on the ConPTY that ships: test binaries load conpty.dll from their
      # own directory exactly as pterminal.exe does, and
      # `conpty_in_use_matches_what_ships_beside_the_binary` fails unless it was
      # really loaded.
      - name: test on the bundled ConPTY
        shell: pwsh
        env:
          PTERMINAL_EXPECT_CONPTY_DLL: "1"
        run: |
          Copy-Item installer\conpty\* target\debug\deps\
          cargo test --workspace --no-fail-fast

      # No `--workspace` needed here: the root package pulls in both library
      # crates, and this is what puts `pterminal.exe` + `pterm_hook.exe` into
      # `target/release/` for the installer step.
      - name: build
        run: cargo build --release

      - name: build installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe" /DAppVersion=$version installer\pterminal.iss

      - name: publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            "installer\Output\pTerminal-setup.exe" `
            --title "pTerminal $env:GITHUB_REF_NAME" `
            --generate-notes
